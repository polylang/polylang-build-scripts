# Same schedule across Polylang plugins; Dependabot does not sync versions between repos.
# allow — if a package does not match, Dependabot does not open a version PR or a security PR for it.
# groups.peer-deps — among packages that already passed allow, matching ones are collapsed into one PR instead of many.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    allow:
      - dependency-type: production
      - dependency-name: clean-webpack-plugin
      - dependency-name: copy-webpack-plugin
      - dependency-name: css-minimizer-webpack-plugin
      - dependency-name: glob
      - dependency-name: mini-css-extract-plugin
      - dependency-name: sass-loader
      - dependency-name: terser-webpack-plugin
      - dependency-name: webpack
    groups:
      peer-deps:
        patterns:
          - clean-webpack-plugin
          - copy-webpack-plugin
          - css-minimizer-webpack-plugin
          - glob
          - mini-css-extract-plugin
          - sass-loader
          - terser-webpack-plugin
          - webpack
